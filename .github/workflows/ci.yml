name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Track, don't fix (audit A5): the current advisories are transitive
      # via next/monaco-editor. Non-blocking on purpose — the step logs the
      # findings and never gates the pipeline; watch for a patched release.
      - name: Dependency audit (track only)
        continue-on-error: true
        run: pnpm audit --prod
