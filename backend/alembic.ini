[alembic]
script_location = alembic

# One physical folder per subsystem (build.md §4.2's "no cross-subsystem migration merge
# conflicts", implemented via Alembic's multi-location support + branch labels — see
# alembic/env.py for the corresponding shared MetaData).
version_locations = %(here)s/alembic/versions/core %(here)s/alembic/versions/platform_events %(here)s/alembic/versions/content %(here)s/alembic/versions/judge %(here)s/alembic/versions/labs %(here)s/alembic/versions/assessments %(here)s/alembic/versions/gamification %(here)s/alembic/versions/commerce
version_path_separator = space

prepend_sys_path = .

# sqlalchemy.url is deliberately absent — alembic/env.py reads DATABASE_URL from
# platform_core.core.config.settings so there is exactly one place the connection string lives.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
