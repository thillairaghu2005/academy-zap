name: zapsters-backend

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zapsters
      POSTGRES_PASSWORD: zapsters
      POSTGRES_DB: zapsters
    ports:
      # Host port 5433, not 5432 — this machine already runs another project's Postgres
      # container on 5432; the in-container port (and DATABASE_URL below) stay standard.
      - "5433:5432"
    volumes:
      - zapsters_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapsters -d zapsters"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port 6380, not 6379 — see the postgres service comment above.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zapsters
      MINIO_ROOT_PASSWORD: zapsters-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zapsters_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: zapsters-dev-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - zapsters_meili_data:/meili_data

volumes:
  zapsters_postgres_data:
  zapsters_minio_data:
  zapsters_meili_data:
